<style>
  :root{--lime:#9dff1f;--bg:#050706;--card:#0e1311;--line:rgba(157,255,31,.28);--txt:#eef2ef;--mut:#a3aba6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;min-height:100%}
  body{background:radial-gradient(120% 60% at 50% -10%,#1a2b0c 0%,var(--bg) 60%) fixed;padding:max(18px,env(safe-area-inset-top)) 16px 28px}
  .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  header{text-align:center;padding:6px 0 4px}
  header img{width:112px;height:112px;border-radius:22px;border:2px solid var(--lime);box-shadow:0 0 28px rgba(157,255,31,.35);object-fit:cover}
  h1{font-family:'Chakra Petch',sans-serif;font-size:30px;letter-spacing:.5px;margin-top:12px;line-height:1}
  h1 small{display:block;font-size:13px;letter-spacing:6px;color:var(--lime);margin-top:6px}
  .lead{color:var(--mut);font-size:15px;margin-top:12px}
  .lead b{color:var(--txt)}
  .usta{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .who{display:flex;align-items:center;gap:12px}
  .av{width:48px;height:48px;border-radius:14px;background:var(--lime);color:#0a0c0b;display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:22px;flex:none}
  .who h2{font-size:19px;font-weight:800}
  .who p{color:var(--mut);font-size:14px;font-family:'Chakra Petch',sans-serif;letter-spacing:.5px}
  .btns{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
  .b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:800;font-size:16px;text-decoration:none}
  .wa{background:#25d366;color:#04140a}
  .tel{background:transparent;color:var(--txt);border:1.5px solid rgba(255,255,255,.22)}
  .b svg{width:22px;height:22px;flex:none}
  .save{background:transparent;border:1.5px dashed var(--line);color:var(--lime);min-height:50px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
  .info{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 16px;color:var(--mut);font-size:14px}
  .info a{color:var(--mut);text-decoration:none}
  .info a:hover,.info a:focus-visible{color:var(--lime)}
  .site{display:block;text-align:center;color:var(--lime);font-weight:700;font-size:14px;text-decoration:none;margin-top:2px}
  a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
